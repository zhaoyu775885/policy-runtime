[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "policy-runtime"
version = "0.1.0"
description = "A minimal client/server runtime for decoupling VLA policies from simulation environments."
requires-python = ">=3.12"
dependencies = ["numpy"]

[tool.hatch.build.targets.wheel]
packages = ["policy_runtime"]
